name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assemble and validate source
        shell: pwsh
        run: |
          $parts = @(
            "source_parts/vls_01.txt",
            "source_parts/vls_02.txt",
            "source_parts/vls_03.txt",
            "source_parts/vls_04.txt"
          )
          $source = [string]::Concat(
            [System.IO.File]::ReadAllText((Resolve-Path $parts[0])),
            [System.IO.File]::ReadAllText((Resolve-Path $parts[1])),
            [System.IO.File]::ReadAllText((Resolve-Path $parts[2])),
            [System.IO.File]::ReadAllText((Resolve-Path $parts[3]))
          )
          [System.IO.File]::WriteAllText(
            "virtual_live_streamer.py",
            $source,
            [System.Text.UTF8Encoding]::new($false)
          )

          @'
          from pathlib import Path

          p = Path("virtual_live_streamer.py")
          s = p.read_text(encoding="utf-8")
          out = []
          i = 0
          quote = None
          triple = False
          escaped = False
          comment = False

          while i < len(s):
              c = s[i]

              if comment:
                  out.append(c)
                  if c == "\n":
                      comment = False
                  i += 1
                  continue

              if quote is None:
                  if c == "#":
                      comment = True
                      out.append(c)
                      i += 1
                      continue
                  if c in ("'", '"'):
                      if s.startswith(c * 3, i):
                          quote = c
                          triple = True
                          out.append(c * 3)
                          i += 3
                      else:
                          quote = c
                          triple = False
                          escaped = False
                          out.append(c)
                          i += 1
                      continue
                  out.append(c)
                  i += 1
                  continue

              if triple:
                  if s.startswith(quote * 3, i):
                      out.append(quote * 3)
                      i += 3
                      quote = None
                      triple = False
                  else:
                      out.append(c)
                      i += 1
                  continue

              if escaped:
                  out.append(c)
                  escaped = False
                  i += 1
                  continue

              if c == "\\":
                  out.append(c)
                  escaped = True
                  i += 1
                  continue

              if c == quote:
                  out.append(c)
                  quote = None
                  i += 1
                  continue

              if c == "\n":
                  out.append("\\n")
                  i += 1
                  continue

              out.append(c)
              i += 1

          p.write_text("".join(out), encoding="utf-8")
          '@ | Set-Content repair_source.py -Encoding utf8

          python repair_source.py
          python -m py_compile virtual_live_streamer.py

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe was not found" }
          Copy-Item $ffmpeg.FullName "bin\ffmpeg.exe" -Force

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Virtual Live Streamer" --add-binary "bin\ffmpeg.exe;bin" virtual_live_streamer.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Virtual-Live-Streamer-Windows
          path: "dist/Virtual Live Streamer.exe"
          if-no-files-found: error
